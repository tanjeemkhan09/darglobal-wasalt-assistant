<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dar Global &amp; Wasalt Assistant</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e3e0d6;--acc:#8a6d3b;--acc2:#1f4d3a;--user:#1f4d3a;--userink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1c1c1a;--ink:#ece9e0;--mute:#9a978c;--line:#2e2d29;--acc:#c9a86a;--acc2:#4c9a78;--user:#2b5e49;--userink:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px}
header p{margin:2px 0 0;color:var(--mute);font-size:12.5px}
#log{flex:1;overflow:auto;padding:16px;max-width:820px;width:100%;margin:0 auto}
.msg{margin:0 0 14px;display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.user .bubble{background:var(--user);color:var(--userink);border-color:transparent}
.trace{font-size:12px;color:var(--mute);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:transparent;white-space:normal}
.src{font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--mute)}
.src a{color:var(--acc);text-decoration:none}.src a:hover{text-decoration:underline}
.src div{margin:2px 0;overflow:hidden;text-overflow:ellipsis}
.cite{color:var(--acc);font-weight:600}
.meta{font-size:11.5px;color:var(--mute);margin-top:6px}
#sugg{max-width:820px;margin:0 auto;padding:0 16px 8px;display:flex;flex-wrap:wrap;gap:8px;width:100%}
#sugg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
#sugg button:hover{border-color:var(--acc)}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);max-width:100%}
.row{display:flex;gap:8px;max-width:820px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-height:120px}
textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
#send{font:inherit;font-weight:600;border:0;border-radius:12px;padding:0 18px;background:var(--acc2);color:#fff;cursor:pointer}
#send:disabled{opacity:.5;cursor:wait}
.foot{font-size:11px;color:var(--mute);text-align:center;padding:0 16px 8px}
.dots span{animation:b 1.2s infinite;display:inline-block}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.2}30%{opacity:1}}
</style>
</head>
<body>
<header>
  <h1>Dar Global &amp; Wasalt Assistant</h1>
  <p>Agentic RAG over public data from darglobal.co.uk and wasalt.sa &middot; answers cite their sources</p>
</header>
<div id="log" aria-live="polite"></div>
<div id="sugg"></div>
<form id="f"><div class="row">
  <textarea id="q" rows="1" placeholder="Ask about Dar Global projects, Wasalt listings, markets..." maxlength="2000" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</div></form>
<div class="foot">Information is a snapshot of public web pages and may be out of date. Not financial advice.</div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send'),sugg=document.getElementById('sugg');
let history=[];
const SUGG=["What is Dar Global and what projects does it have?","Which branded residences does Dar Global offer?","Show apartments for sale in Riyadh under 700,000 SAR","What is the average price of villas in Jeddah?","How does Wasalt auctions work?"];
SUGG.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.type='button';b.onclick=()=>{q.value=t;ask()};sugg.appendChild(b)});
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(text,sources){
  return esc(text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[(\d+)\]/g,(m,n)=>{
    const s=sources&&sources[n-1];return s?`<a class="cite" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">[${n}]</a>`:m});
}
function add(role,html){const m=document.createElement('div');m.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.innerHTML=html;m.appendChild(b);log.appendChild(m);log.scrollTop=log.scrollHeight;return b}
async function ask(){
  const text=q.value.trim();if(!text||send.disabled)return;
  q.value='';sugg.style.display='none';send.disabled=true;
  add('user',esc(text));
  const b=add('bot','<span class="dots"><span>●</span><span>●</span><span>●</span></span><div class="trace"></div>');
  const trace=b.querySelector('.trace');
  let answer=null;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||('HTTP '+r.status))}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(!line.trim())continue;
        const ev=JSON.parse(line);
        if(ev.type==='status'||ev.type==='tool'){const c=document.createElement('span');c.className='chip';
          c.textContent=ev.type==='tool'?('🔧 '+ev.name+'('+Object.entries(ev.args).map(([k,v])=>k+': '+v).join(', ')+')'):('🔎 '+ev.message);trace.appendChild(c)}
        else if(ev.type==='answer')answer=ev;
        else if(ev.type==='error')throw new Error(ev.message);
        log.scrollTop=log.scrollHeight;}
    }
    if(!answer)throw new Error('No answer received');
    let html=render(answer.text,answer.sources);
    const used=(answer.sources||[]).map((s,i)=>({s,n:i+1})).filter(x=>new RegExp('\\['+x.n+'\\]').test(answer.text));
    if(used.length)html+='<div class="src">'+used.map(x=>`<div>[${x.n}] <a href="${esc(x.s.url)}" target="_blank" rel="noopener">${esc(x.s.title||x.s.url)}</a></div>`).join('')+'</div>';
    html+=`<div class="meta">${esc(answer.model)} &middot; ${answer.latency_s}s &middot; ${answer.steps} tool round(s)</div>`;
    b.innerHTML=html+'<div class="trace">'+trace.innerHTML+'</div>';
    history.push({role:'user',content:text},{role:'assistant',content:answer.text});
  }catch(e){b.innerHTML='⚠️ '+esc(e.message)}
  send.disabled=false;q.focus();log.scrollTop=log.scrollHeight;
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();ask()});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
</script>
</body>
</html>
